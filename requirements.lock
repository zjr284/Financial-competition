# 用途：记录本模块开发与验证时实际使用的版本，便于评审复现同一运行结果
#       （`实施路线与验收清单.md` 第 2 节要求 requirements.lock）。
# 安装：
#   必需依赖（契约校验与 HTTP JSON 处理）：
#     python -m pip install -r contracts/requirements.txt
