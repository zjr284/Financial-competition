#     python -m pip install --target vendor/python "pypdf==6.20.0" "pdfminer.six==20260107"
#   缺失可选依赖时 app/bootstrap.py 会自动跳过，PDF 解析退回纯标准库后端。
#
# 记录环境：Windows + Python 3.11.4

